name: Native Windows x64

on:
  workflow_dispatch:
  push:
    paths:
      - "**"
      - ".github/workflows/windows-native.yml"

jobs:
  build-windows:
    runs-on: windows-latest

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Install Qt 6
        uses: jurplel/install-qt-action@v4
        with:
          version: "6.8.2"
          arch: "win64_mingw"
          cache: true

      - name: Configure
        shell: pwsh
        run: cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release

      - name: Build
        shell: pwsh
        run: cmake --build build --config Release --parallel

      - name: Prepare standalone Windows bundle
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path standalone | Out-Null
          Copy-Item build/parts-inventory.exe standalone/parts-inventory.exe
          windeployqt --release --no-translations standalone/parts-inventory.exe
          Copy-Item C:/mingw64/bin/libgcc_s_seh-1.dll standalone/libgcc_s_seh-1.dll
          Copy-Item C:/mingw64/bin/libstdc++-6.dll standalone/libstdc++-6.dll
          Copy-Item C:/mingw64/bin/libwinpthread-1.dll standalone/libwinpthread-1.dll

      - name: Install NSIS
        shell: pwsh
        run: choco install nsis -y --no-progress

      - name: Package NSIS installer
        shell: pwsh
        run: cpack --config build/CPackConfig.cmake -C Release -G NSIS

      - name: Upload executable and installer
        uses: actions/upload-artifact@v4
        with:
          name: parts-inventory-windows-x64
          path: |
            standalone/**
            build/*-win64.exe
          if-no-files-found: error
